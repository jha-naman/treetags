# Scanner-generation manifest consumed by `cargo run --bin generate-scanner`.
name = "c"
grammar = "grammar/c/grammar.js"
output = "src/parser/tree_free/c/generated.rs"
# `preproc_arg` is a greedy rest-of-line token tree-sitter gates by parse state;
# the linear scanner cannot gate it, so it would swallow whole lines.
exclude = ["preproc_arg"]
