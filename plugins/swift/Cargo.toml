[package]
name = "treetags-plugin-swift"
version = "0.1.0"
edition = "2021"
description = "Swift plugin for treetags"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
treetags-plugin-common = { path = "../common", features = ["tree-walker"] }
tree-sitter = "0.26.5"
tree-sitter-swift = "0.7.3"
wit-bindgen = "0.58"
